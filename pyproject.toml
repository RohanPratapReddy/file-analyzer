[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# ``file-analyzer`` is a thin META-PACKAGE since the 3-wheel split. It carries no
# code: installing it pulls the *analysis profile* -- the pure-stdlib client
# foundation plus the analyzer engine -- so ``pip install file-analyzer`` keeps
# working for existing users and lands exactly what an analysis node needs. The
# database-hosting server is a deliberate, separate ``file-analyzer-server``
# install (installing it here would reintroduce the combined bloat the split
# removed). The platform actually lives in three wheels that merge into one
# PEP 420 ``file_analyzer`` namespace:
#
#   packages/client  -> file-analyzer-client  (stdlib foundation + read-only DB)
#   packages/server  -> file-analyzer-server  (the database-hosting server)
#   packages/engine  -> file-analyzer-engine  (the analyzer fleet, this meta pulls it)
#
# Version + the two lockstep runtime pins are supplied by setup.py, which
# single-sources the version from packages/client/file_analyzer/_version.py.
# ---------------------------------------------------------------------------
[project]
name = "file-analyzer"
dynamic = ["version", "dependencies"]
description = "Meta-package for the file-analyzer platform: installs the analysis profile (client foundation + analyzer engine). The database-hosting server ships separately as file-analyzer-server."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Rohan Pratap Reddy Ravula" }]
keywords = ["static-analysis", "code-intelligence", "repository", "sqlite", "mcp", "ai-agent", "repository-monitor", "incremental-analysis", "document-intelligence"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]

# Convenience extras that forward to the engine's own extras (and, for `server`,
# to the separate server wheel), so the historical `pip install file-analyzer[...]`
# invocations keep resolving. The base install stays lean (client + engine only).
[project.optional-dependencies]
agent = ["file-analyzer-engine[agent]"]
monitor-postgres = ["file-analyzer-engine[monitor-postgres]"]
monitor-mysql = ["file-analyzer-engine[monitor-mysql]"]
parse = ["file-analyzer-engine[parse]"]
ocr = ["file-analyzer-engine[ocr]"]
pii = ["file-analyzer-engine[pii]"]
eval = ["file-analyzer-engine[eval]"]
document = ["file-analyzer-engine[document]"]
# Opt-in: also install the database-hosting server alongside the analysis profile.
server = ["file-analyzer-server"]

[project.urls]
Homepage = "https://github.com/RohanPratapReddy/file-analyzer"
Repository = "https://github.com/RohanPratapReddy/file-analyzer"

# This meta ships no importable code -- an empty package set keeps the wheel to
# just metadata (the deps are what do the work).
[tool.setuptools]
packages = []

# ---------------------------------------------------------------------------
# Shared developer tooling for the whole repo (all three packages + tests). The
# CI style gates run `black --check` / `isort --check` against these settings, so
# a local run and the runner agree byte-for-byte. Pin the same tool versions here
# and in .github/workflows/python-app.yml. isort's "black" profile makes the two
# agree on import wrapping.
# target-version caps at py310 to match the CI runner (actions/setup-python
# 3.10): black skips its AST-equivalence safety check when the running Python is
# older than a listed target, and the emitted style is identical for py39-py310.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py39", "py310"]

[tool.isort]
profile = "black"
line_length = 88

# The real test suite lives in tests/. Pin testpaths so a bare `pytest` from the
# repo root collects only it -- and never wanders into the packages/ trees, where
# analyzer modules whose names happen to match pytest's `test_*` glob (e.g.
# file_analyzer/prog_lang/test_def_analyzer.py, the analyzer for `.test` files)
# would otherwise be picked up and fail to import under the PEP 420 namespace.
[tool.pytest.ini_options]
testpaths = ["tests"]
