# Install, lint, smoke-test and test file-analyzer on a single Python version.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # The core is pure-stdlib (project.dependencies is empty); install the
          # package itself plus the MCP extra. Do NOT install requirements.txt --
          # those are OPTIONAL deep-parse libs (GDAL, rasterio, ...) that need
          # system libraries not present on the runner.
          pip install ".[agent]"

      - name: Lint with flake8
        run: |
          # Fail only on real errors: syntax errors / undefined names.
          flake8 src mcp_server.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Everything else is advisory (never fails the build).
          flake8 src mcp_server.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Smoke-test the engine
        run: |
          python -m mcp_server --precompile
          python -m src.main --list-components --quiet

      - name: Test with pytest
        run: |
          # Tolerate "no tests collected" (exit code 5) until a suite exists.
          # The `|| ...` keeps `bash -e` from aborting on pytest's exit code.
          pytest -q || [ $? -eq 5 ]
