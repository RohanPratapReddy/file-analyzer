# =============================================================================
# tabgen "readers" — Postgres backend + loader + pgAdmin frontend
# =============================================================================
# Brings up the full stack that hosts the databases AnalysisEngine produces:
#
#   postgres   the backend that stores the loaded schema/data/archive/binary
#              tables.
#   loader     one-shot job: waits for postgres, then loads every *.db (via
#              pgloader) and every postgresql-dialect *.sql (via psql) found
#              under the mounted artifacts dir -- each into its own database.
#   pgadmin    web frontend (http://localhost:8080), pre-registered against the
#              postgres server so you can browse the loaded databases.
#
# Usage:
#   1. Produce the artifacts with the `engine` service -- it runs
#      `python -m file_analyzer.main` over a source repo and writes repository.db
#      (+ repository_schema.sql, + any nested per-archive sub-DBs) to ./artifacts:
#         SOURCE_DIR=/path/to/repo docker compose --profile engine run --build engine
#      (or run AnalysisEngine / `python -m file_analyzer.main` yourself into ./artifacts).
#   2. Point ARTIFACTS_DIR at it and bring the stack up:
#         ARTIFACTS_DIR=./artifacts docker compose up --build
#   3. Open http://localhost:8080  (login below) -> expand the "tabgen" server.
#
# This IS the default compose file (docker-compose.yml), so `-f` is unnecessary.
# The `engine` and `reader` services are opt-in behind their profiles, so a plain
# `docker compose up` runs only postgres + loader + pgadmin.
#
# All credentials/ports below have safe defaults and can be overridden via env
# (or a sibling .env file). Defaults are for LOCAL USE ONLY -- change them for
# any shared/exposed deployment.
# =============================================================================

name: tabgen-readers

services:
  # ---------------------------------------------------------------- backend --
  postgres:
    image: postgres:16-alpine
    container_name: tabgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      # The default database; the loader creates one more DB per extra artifact.
      POSTGRES_DB: ${POSTGRES_DB:-repository}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-repository}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tabgen]

  # ----------------------------------------------------------------- loader --
  loader:
    build:
      context: .
      dockerfile: Dockerfile
      target: loader
    container_name: tabgen-loader
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-sentinel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      ARTIFACTS_DIR: /artifacts
      VIEWS_SQL: /loader/views.pgsql.sql
    volumes:
      # Host directory holding AnalysisEngine output (read-only). Set
      # ARTIFACTS_DIR on the host to relocate it; defaults to ./artifacts .
      - ${ARTIFACTS_DIR:-./artifacts}:/artifacts:ro
      # Postgres CREATE-VIEW DDL for the analysis views (file_analyzer/views/catalog.py),
      # generated by `python -m file_analyzer.views artifacts file_analyzer/views/sql`. pgloader copies
      # tables only, so the loader (re)creates these views after each .db load.
      - ./file_analyzer/views/sql/views.pgsql.sql:/loader/views.pgsql.sql:ro
    restart: "no"          # one-shot: runs the load, then exits
    networks: [tabgen]

  # ------------------------------------------------------------ engine (opt) -
  # The analysis ENGINE: runs `python -m file_analyzer.main` (the file_analyzer package entry point)
  # over a source repository and PRODUCES the artifacts the loader/reader consume
  # (repository.db + repository_schema.sql, with the v_* analysis views installed).
  # Opt-in via the `engine` profile:
  #   SOURCE_DIR=/path/to/repo ARTIFACTS_DIR=./artifacts \
  #     docker compose --profile engine run --build engine
  # Then bring up the stack (postgres + loader) to ingest ./artifacts as usual.
  #
  # Passing arguments to main.py -- two equivalent ways:
  #   (a) ENGINE_ARGS as one string (shell-split into argv, appended to the
  #       `python -m file_analyzer.main` entrypoint). Overrides `command` below entirely:
  #         ENGINE_ARGS="/workspace --out /artifacts --dialect postgresql --no-git --workers 8" \
  #           docker compose --profile engine run --build engine
  #   (b) inline after the service name (these REPLACE `command` for that run):
  #         docker compose --profile engine run --build engine \
  #           /workspace --out /artifacts --dialect postgresql
  #
  # Full main.py argument surface (run `... run engine --help` for the live list):
  #   source (positional; default '.')  the repo/dir to analyze  -> mount at /workspace
  #   -o/--out PATH                      output dir               -> /artifacts
  #   --db NAME / --sql NAME             artifact filenames (repository.db / .sql)
  #   --dialect {sqlite,postgresql}      SQL dump dialect
  #   --temp PATH / --keep-temp          staging dir controls
  #   --workers / --plane-workers / --injection-workers N   concurrency
  #   --python-exe PATH                  interpreter for subprocess planes
  #   --order {bfs,dfs} / --ignore-dir / --ignore-file       census walk
  #   --exclude-folder / --exclude-file / --ext-catalog PATH / --no-git
  #   --no-linkage / --no-archives / --max-archive-depth N   stage toggles
  #   --no-binary / --no-conversions / --no-conversion-analysis / --conversions-dir
  #   --no-views                         skip installing the v_* analysis views
  #   --schema-name NAME / --no-drop     SQL dump/DDL controls
  #   --list-components / -C/--component NAME / --emit / --tables-json /
  #   --build-db / --mapping             single-component (standalone block) mode
  engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: engine
    profiles: ["engine"]
    # Default run: analyze /workspace -> /artifacts. Set ENGINE_ARGS to pass ANY
    # main.py arguments (it is shell-split and appended to the entrypoint); or
    # override inline after the service name on `docker compose run`.
    command: ${ENGINE_ARGS:-/workspace --out /artifacts}
    volumes:
      # Source repository to analyze (read-only). Must be a git repo unless you
      # pass --no-git. Set SOURCE_DIR on the host; defaults to ./workspace .
      - ${SOURCE_DIR:-./workspace}:/workspace:ro
      # Artifacts land here (read-write); the loader later mounts this :ro.
      - ${ARTIFACTS_DIR:-./artifacts}:/artifacts
    networks: [tabgen]

  # ------------------------------------------------------------ reader (opt) -
  # The Go VIEW-reader worker, containerized. Discovers the installed analysis
  # views from a mounted artifact and reads them concurrently (strictly
  # read-only) -- the same views the loader materializes on Postgres. Opt-in:
  #   docker compose --profile reader run --build reader
  # Point it at a different artifact / tune workers by overriding the command:
  #   ... run --build reader -source /artifacts/some_archive.db -workers 8
  reader:
    build:
      context: .
      dockerfile: Dockerfile
      target: reader
    profiles: ["reader"]
    volumes:
      - ${ARTIFACTS_DIR:-./artifacts}:/artifacts:ro
    networks: [tabgen]

  # ----------------------------------------------------------- monitor (opt) -
  # The always-on background MONITOR: `python -m file_analyzer monitor /workspace`. Watches
  # the mounted repo, records the last 16 changes into the FIFO diff database
  # (under /artifacts/.file-analyzer/monitor/changes.db) and re-analyzes changed
  # files across the Go worker pool as agents / users / tools touch them. Opt-in:
  #   SOURCE_DIR=/path/to/repo ARTIFACTS_DIR=./artifacts \
  #     docker compose --profile monitor up --build monitor
  # Inspect it live from the host with the read-only diff DB, or over MCP.
  #
  # Zombie prevention: `init: true` runs Docker's tini as PID 1 to reap orphans
  # (the image ALSO bakes in tini as a second line), and `stop_grace_period`
  # gives the monitor's SIGTERM handler time to drain daemon threads and wait on
  # every worker child before the container is killed.
  #
  # Tune via MONITOR_ARGS (shell-split, replaces `command`), e.g.:
  #   MONITOR_ARGS="/workspace --out /artifacts --interval 1 --max-workers 200 \
  #     --min-workers 20" docker compose --profile monitor up --build monitor
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
      target: monitor
    profiles: ["monitor"]
    init: true                     # tini as PID 1: forwards signals, reaps zombies
    stop_grace_period: 30s         # let the SIGTERM handler drain before SIGKILL
    restart: unless-stopped
    command: ${MONITOR_ARGS:-/workspace --out /artifacts --interval 2}
    volumes:
      # Repo to watch. Read-only: the monitor only reads source to re-analyze it;
      # all state (diff DB, per-file analysis) is written under /artifacts.
      - ${SOURCE_DIR:-./workspace}:/workspace:ro
      - ${ARTIFACTS_DIR:-./artifacts}:/artifacts
    networks: [tabgen]

  # ---------------------------------------------------------------- frontend -
  # pgAdmin is used here; to swap in another frontend, replace this service with
  # e.g. Mathesar (mathesar/mathesar) or Adminer (adminer) -- all connect to the
  # same `postgres` service on the `tabgen` network.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tabgen-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sentinel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-sentinel}
      # Desktop-style single-user mode (no per-user login wall) for local use.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      # Pre-registers the postgres server in pgAdmin's browser tree.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    networks: [tabgen]

volumes:
  pgdata:
  pgadmin:

networks:
  tabgen:
    driver: bridge
